api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  workers: 4

#  # Security
#  secret_key: ${SECRET_KEY:your-secret-key-here}
#  access_token_expire_minutes: 30

  # CORS settings
  cors:
    allow_origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:8080"
    allow_methods: ["GET", "POST", "PUT", "DELETE"]
    allow_headers: ["*"]

  # Rate limiting
  rate_limit:
    requests_per_minute: 100
    burst_size: 20

  # Model serving
  model_serving:
    timeout: 30
    max_batch_size: 64
    cache_predictions: true
    cache_ttl: 3600  # seconds