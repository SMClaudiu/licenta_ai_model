services:
  ai-model:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licenta-ai-model
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=licenta-db
      - DB_NAME=licenta_db
      - DB_USER=postgres
      - DB_PASSWORD=101102
      - PYTHONUNBUFFERED=1
      # The CUDA_VISIBLE_DEVICES variable is removed as it's irrelevant for CPU
    volumes:
      # This volume is for development (live code reload). Remove for production.
      - ./src:/app/src
      # This volume correctly persists your trained model artifacts
      - model-data:/app/artifacts

    # The ENTIRE 'deploy' section is REMOVED because it contains GPU-specific resource reservations.

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

volumes:
  model-data:

networks:
  app-network:
    external: true